name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derived directories match their source
        run: ./scripts/sync.sh --check

  valid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frontmatter is valid and names match directories
        run: python3 scripts/validate.py
